#Workflow to update flake.nix vendorhash upon dependency changes 
name: Update Nix vendor hash

on:
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "*.go"
      - "**/*.go"
      - "flake.nix"
      - "flake.lock"

permissions:
  contents: write

jobs:
  update-vendor-hash:
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.NIX_UPDATE_TOKEN }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Verify Go module files
        run: nix develop --command go mod tidy -diff

      - name: Recalculate vendorHash
        run: |
          nix run github:Mic92/nix-update -- \
            swytch --flake --version=skip

      - name: Build Swytch
        run: nix build .#swytch --show-trace -L

      - name: Check flake
        run: nix flake check --show-trace -L

      - name: Commit updated hash
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- flake.nix; then
            echo "vendorHash is already correct."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add flake.nix
          git commit -m "chore(nix): update Go vendor hash"
          git push origin "HEAD:${PR_BRANCH}"
